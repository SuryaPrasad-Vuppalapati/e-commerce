version: 2

sources:
  - name: raw
    database: ECOMMERCE_DB
    schema:  
    description: "Raw e-commerce data loaded from AWS S3"
    freshness:
      warn_after:  {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _loaded_at

    tables:
      - name: orders_raw
        description: "Raw order transactions from all sales channels"
        columns:
          - name: order_id
            tests: [not_null]
          - name: customer_id
            tests: [not_null]
          - name: order_date
            tests: [not_null]
          - name: order_status
            tests:
              - accepted_values:
                  values: ['completed', 'pending', 'refunded', 'cancelled']

      - name: clicks_raw
        description: "Raw click and page event stream"
        columns:
          - name: click_id
            tests: [not_null]
          - name: event_type
            tests:
              - accepted_values:
                  values: ['page_view', 'product_view', 'add_to_cart', 'checkout', 'purchase']

      - name: sessions_raw
        description: "Raw web session data with UTM attribution"
        columns:
          - name: session_id
            tests: [not_null]
          - name: session_start
            tests: [not_null]